<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الذكاء الاصطناعي الخاص</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .chat-container { height: calc(100vh - 160px); }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen">

  <!-- Header -->
  <header class="bg-gray-800 p-4 shadow border-b border-gray-700 flex justify-between items-center">
    <h1 class="text-lg font-bold text-blue-400">🤖 مساعدي الخاص</h1>
    <button onclick="toggleSettings()" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded border border-gray-600">⚙️ إعداد الـ API</button>
  </header>

  <!-- Settings Modal (Hidden by default) -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-800 p-6 rounded-xl w-full max-w-md border border-gray-700">
      <h2 class="text-md font-bold mb-3 text-gray-200">إعدادات مفتاح API</h2>
      <input type="password" id="apiKeyInput" placeholder="أدخل مفتاح OpenRouter API..." class="w-full p-3 bg-gray-900 border border-gray-700 rounded text-sm text-white focus:outline-none focus:border-blue-500 mb-4">
      <div class="flex justify-end gap-2">
        <button onclick="saveApiKey()" class="bg-blue-600 px-4 py-2 rounded text-sm font-semibold hover:bg-blue-500">حفظ</button>
      </div>
    </div>
  </div>

  <!-- Chat Container -->
  <main id="chatBox" class="chat-container overflow-y-auto p-4 space-y-4 flex-1">
    <div class="bg-gray-800 p-3 rounded-lg max-w-[85%] self-start border border-gray-700 text-sm">
      مرحباً بك! أنا مساعدك الخاص بدون قيود أو حدود. أدخل مفتاح API الخاص بك من زر الإعدادات وأرسل رسالتك الأولى.
    </div>
  </main>

  <!-- Input Area -->
  <footer class="p-4 bg-gray-800 border-t border-gray-700">
    <form id="chatForm" onsubmit="sendMessage(event)" class="flex gap-2">
      <input type="text" id="userInput" placeholder="اكتب رسالتك أو أكوادك هنا..." class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500" required>
      <button type="submit" class="bg-blue-600 hover:bg-blue-500 px-5 py-3 rounded-lg text-sm font-bold transition-all">إرسال</button>
    </form>
  </footer>

  <script>
    const API_URL = "https://openrouter.ai/api/v1/chat/completions";
    const MODEL_NAME = "deepseek/deepseek-chat:free"; // نموذج قوي ومجاني للبرمجة والمحادثة

    function toggleSettings() {
      const modal = document.getElementById('settingsModal');
      modal.classList.toggle('hidden');
      const savedKey = localStorage.getItem('user_api_key') || '';
      document.getElementById('apiKeyInput').value = savedKey;
    }

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if(key) {
        localStorage.setItem('user_api_key', key);
        alert('تم حفظ المفتاح بنجاح!');
        toggleSettings();
      }
    }

    async function sendMessage(e) {
      e.preventDefault();
      const apiKey = localStorage.getItem('user_api_key');
      if(!apiKey) {
        alert('يرجى إضافة مفتاح API الخاص بك أولاً من زر الإعدادات أعلى الشاشة.');
        toggleSettings();
        return;
      }

      const inputField = document.getElementById('userInput');
      const text = inputField.value.trim();
      if(!text) return;

      appendMessage(text, 'user');
      inputField.value = '';

      const loadingId = appendMessage('جاري التفكير...', 'bot', true);

      try {
        const response = await fetch(API_URL, {
  method: 'POST',
  headers: {
    'Authorization': `Bearer ${apiKey}`,
    'HTTP-Referer': window.location.origin, // لتحديد مصدر الموقع
    'X-Title': 'Mody AI Assistant',         // اسم التطبيق
    'Content-Type': 'application/json'
  },
  body: JSON.stringify({
    model: MODEL_NAME,
    messages: [{ role: 'user', content: text }]
  })
});

        const data = await response.json();
        const botReply = data.choices?.[0]?.message?.content || 'حدث خطأ أثناء المعالجة.';
        
        document.getElementById(loadingId).innerText = botReply;
      } catch (err) {
        document.getElementById(loadingId).innerText = 'خطأ في الاتصال بالنموذج. تأكد من المفتاح أو الاتصال.';
      }
    }

    function appendMessage(text, sender, isLoading = false) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      const msgId = 'msg-' + Date.now();
      msgDiv.id = msgId;

      msgDiv.className = sender === 'user' 
        ? 'bg-blue-600 text-white p-3 rounded-lg max-w-[85%] mr-auto text-sm'
        : 'bg-gray-800 border border-gray-700 text-gray-100 p-3 rounded-lg max-w-[85%] ml-auto text-sm whitespace-pre-wrap';
      
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgId;
    }
  </script>
</body>
</html>
