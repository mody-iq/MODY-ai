<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الذكاء الاصطناعي الخاص</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .chat-container { height: calc(100vh - 160px); }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen">

  <!-- Header -->
  <header class="bg-gray-800 p-4 shadow border-b border-gray-700 flex justify-between items-center">
    <h1 class="text-lg font-bold text-blue-400">🤖 مساعدي الخاص</h1>
    <div class="text-xs bg-gray-700 px-3 py-1 rounded border border-gray-600 text-green-400">🟢 متصل بنجاح</div>
  </header>

  <!-- Chat Container -->
  <main id="chatBox" class="chat-container overflow-y-auto p-4 space-y-4 flex-1">
    <div class="bg-gray-800 p-3 rounded-lg max-w-[85%] self-start border border-gray-700 text-sm">
      مرحباً بك يا مودي! التطبيق متصل الآن بالمفتاح الجديد. أرسل رسالتك وسأرد عليك فوراً.
    </div>
  </main>

  <!-- Input Area -->
  <footer class="p-4 bg-gray-800 border-t border-gray-700">
    <form id="chatForm" onsubmit="sendMessage(event)" class="flex gap-2">
      <input type="text" id="userInput" placeholder="اكتب رسالتك أو أكوادك هنا..." class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500" required>
      <button type="submit" class="bg-blue-600 hover:bg-blue-500 px-5 py-3 rounded-lg text-sm font-bold transition-all">إرسال</button>
    </form>
  </footer>

  <script>
    const API_URL = "https://openrouter.ai/api/v1/chat/completions";
    const MODEL_NAME = "google/gemini-2.0-flash-lite-preview-02-05:free";
    
    // مفتاحك الجديد المباشر
    const API_KEY = "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";

    async function sendMessage(e) {
      e.preventDefault();

      const inputField = document.getElementById('userInput');
      const text = inputField.value.trim();
      if(!text) return;

      appendMessage(text, 'user');
      inputField.value = '';

      const loadingId = appendMessage('جاري التفكير...', 'bot', true);

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${API_KEY}`,
            'HTTP-Referer': window.location.origin,
            'X-Title': 'Mody AI App',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: MODEL_NAME,
            messages: [{ role: 'user', content: text }]
          })
        });

        const data = await response.json();
        
        if (data.error) {
          document.getElementById(loadingId).innerText = 'خطأ من السيرفر: ' + (data.error.message || JSON.stringify(data.error));
          return;
        }

        const botReply = data.choices?.[0]?.message?.content || 'لم يتم استلام رد من النموذج.';
        document.getElementById(loadingId).innerText = botReply;
      } catch (err) {
        document.getElementById(loadingId).innerText = 'خطأ في الاتصال بالشبكة: ' + err.message;
      }
    }

    function appendMessage(text, sender) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      const msgId = 'msg-' + Date.now();
      msgDiv.id = msgId;

      msgDiv.className = sender === 'user' 
        ? 'bg-blue-600 text-white p-3 rounded-lg max-w-[85%] mr-auto text-sm'
        : 'bg-gray-800 border border-gray-700 text-gray-100 p-3 rounded-lg max-w-[85%] ml-auto text-sm whitespace-pre-wrap';
      
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgId;
    }
  </script>
</body>
</html>
