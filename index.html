<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مساعدي الخاص</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0f172a;
    color: #e5e7eb;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 16px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { margin: 0; font-size: 18px; color: #60a5fa; }
  #clearBtn {
    background: #334155;
    color: #e5e7eb;
    border: 0;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
  }
  #chatBox {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 88%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user { background: #2563eb; color: #fff; align-self: flex-start; }
  .bot { background: #1e293b; border: 1px solid #334155; align-self: flex-end; }
  footer {
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px));
    background: #1e293b;
    border-top: 1px solid #334155;
  }
  form { display: flex; gap: 8px; }
  #userInput {
    flex: 1;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 12px;
    color: #fff;
    font-size: 16px;
    outline: none;
  }
  #userInput:focus { border-color: #3b82f6; }
  #sendBtn {
    background: #2563eb;
    color: #fff;
    border: 0;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 15px;
    font-weight: bold;
  }
  #sendBtn:disabled { opacity: 0.5; }
</style>
</head>
<body>

<header>
  <h1>🤖 مساعدي الخاص</h1>
  <button id="clearBtn" type="button">محادثة جديدة</button>
</header>

<main id="chatBox">
  <div class="msg bot">مرحباً بك يا مودي! اكتب سؤالك وسأرد عليك.</div>
</main>

<footer>
  <form id="chatForm">
    <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." autocomplete="off" required>
    <button type="submit" id="sendBtn">إرسال</button>
  </form>
</footer>

<script>
  var WORKER_URL = "https://mody-ai-proxy.iraqloin7.workers.dev";
  var history = [];

  var chatBox = document.getElementById("chatBox");
  var chatForm = document.getElementById("chatForm");
  var userInput = document.getElementById("userInput");
  var sendBtn = document.getElementById("sendBtn");
  var clearBtn = document.getElementById("clearBtn");

  function addMessage(text, sender) {
    var div = document.createElement("div");
    div.className = "msg " + sender;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
  }

  chatForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    var text = userInput.value.trim();
    if (!text) return;

    addMessage(text, "user");
    history.push({ role: "user", content: text });
    userInput.value = "";
    sendBtn.disabled = true;

    var loading = addMessage("جاري التفكير...", "bot");

    try {
      var response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });

      var data = await response.json();

      if (data.error) {
        var msg = data.error.message || JSON.stringify(data.error);
        loading.textContent = "خطأ: " + msg;
        history.pop();
      } else {
        var reply = "";
        if (data.choices && data.choices[0] && data.choices[0].message) {
          reply = data.choices[0].message.content;
        }
        if (!reply) reply = "لم يصل رد من النموذج، جرّب مرة ثانية.";
        loading.textContent = reply;
        history.push({ role: "assistant", content: reply });
      }
    } catch (err) {
      loading.textContent = "خطأ في الاتصال: " + err.message;
      history.pop();
    }

    sendBtn.disabled = false;
    chatBox.scrollTop = chatBox.scrollHeight;
  });

  clearBtn.addEventListener("click", function () {
    history = [];
    chatBox.innerHTML = "";
    addMessage("بدأنا محادثة جديدة. تفضل.", "bot");
  });
</script>

</body>
</html>
